name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets, tokens, private keys, or vault contents.**
        For security vulnerabilities, use the private reporting link on the issue chooser instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran. Use a throwaway vault if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gage --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64 / Windows 11 amd64
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Redact anything sensitive.
      render: text

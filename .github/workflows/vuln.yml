name: Vuln

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, since advisories land without any code change.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Supersede in-flight runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Its own workflow, rather than a job in test.yml, so it gets its own status
# badge: unlike build/test/lint, this result can change without a code
# change when a new advisory lands. Needs network (govulncheck fetches the
# vulnerability database), and is platform-independent, so it runs once.
jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache vuln toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: vuln-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: make vuln
        run: make vuln

name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Its own workflow, rather than a step in test.yml, so it gets its own
# status badge. Still run across the full OS matrix: golangci-lint only
# analyzes files whose build constraints match the platform it runs on, so
# the platform-specific code (memlock, vaultlock, ...) is only linted
# natively.
jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `make lint` installs the pinned golangci-lint into ./bin on first
      # use (see GOLANGCI_BIN in the Makefile). Caching that keyed on the
      # pinned version avoids rebuilding it from source on every run,
      # while still reinstalling automatically when the pin changes.
      - name: Cache lint toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # windows-latest doesn't ship GNU make; see test.yml.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make lint
        run: make lint
        shell: bash

name: Lint

on:
  workflow_dispatch:

# Its own workflow, rather than a step in test.yml, so it gets its own
# status badge. Still run across the full OS matrix: golangci-lint only
# analyzes files whose build constraints match the platform it runs on, so
# the platform-specific code (memlock, vaultlock, ...) is only linted
# natively.
jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `make lint` installs the pinned golangci-lint into ./bin on first
      # use (see GOLANGCI_BIN in the Makefile). Caching that keyed on the
      # pinned version avoids rebuilding it from source on every run,
      # while still reinstalling automatically when the pin changes.
      - name: Cache lint toolchain
        uses: actions/cache@v4
        with:
          path: bin
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # windows-latest doesn't ship GNU make; see test.yml.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make lint
        run: make lint
        shell: bash

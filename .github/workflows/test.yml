name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build, tests and the coverage gate. Lint and vuln are separate workflows
# (lint.yml, vuln.yml) so each gets its own status badge.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            codecov-flag: linux
          - os: macos-latest
            codecov-flag: macos
          - os: windows-latest
            codecov-flag: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `make cover-check` installs the pinned go-test-coverage into ./bin
      # on first use (see GO_TEST_COVERAGE_BIN in the Makefile). Caching
      # that keyed on the Makefile avoids reinstalling it on every run,
      # while still reinstalling automatically when the pin changes.
      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: test-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # windows-latest doesn't ship GNU make; every other platform in the
      # matrix already has it. The plan requires make build/test/lint to
      # run natively (not cross-compiled) on all three OSes, so this is
      # the one bit of matrix-specific setup rather than a reason to
      # avoid a Makefile.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # `make test` runs with GOPROXY=off so the test suite can never reach
      # the network. That requires every module to already be in the module
      # cache, which isn't true on a cold runner, so populate it explicitly
      # here rather than relying on setup-go's cache being warm.
      - name: go mod download
        run: go mod download
        shell: bash

      - name: make build
        run: make build
        shell: bash

      # Same run as `make test`, plus a coverage profile. Collected on every
      # OS because the memlock/vaultlock/page-locking code is platform
      # specific and only runs natively.
      - name: make cover
        run: make cover
        shell: bash

      # The per-function breakdown goes to the job summary so no external
      # service is needed to read it. Kept separate from the threshold
      # check below so the report and artifacts still land when it fails.
      - name: Coverage report
        shell: bash
        run: |
          {
            echo "## Coverage (${{ runner.os }})"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage.out
            coverage.html

      # Uploads this OS's coverage.out to Codecov for reporting only (PR
      # diff-coverage comments, trend graphs, browsable line-by-line UI —
      # see codecov.yml). Does not gate the job; make cover-check below is
      # still what enforces the threshold.
      #
      # fail_ci_if_error is false: a Codecov outage/hiccup shouldn't redden
      # CI for a contributor whose code is fine, and secrets.CODECOV_TOKEN
      # is unavailable on fork PR runs (GitHub withholds repo secrets from
      # them) — this keeps external contributors' CI green either way.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: ${{ matrix.codecov-flag }}
          fail_ci_if_error: false

      # Fails the job if total coverage is below the threshold in
      # .testcoverage.yml.
      - name: make cover-check
        run: make cover-check
        shell: bash

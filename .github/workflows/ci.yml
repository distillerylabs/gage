name: CI

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # windows-latest doesn't ship GNU make; every other platform in the
      # matrix already has it. The plan requires make build/test/lint to
      # run natively (not cross-compiled) on all three OSes, so this is
      # the one bit of matrix-specific setup rather than a reason to
      # avoid a Makefile.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # `make test` runs with GOPROXY=off so the test suite can never reach
      # the network. That requires every module to already be in the module
      # cache, which isn't true on a cold runner, so populate it explicitly
      # here rather than relying on setup-go's cache being warm.
      - name: go mod download
        run: go mod download
        shell: bash

      - name: make build
        run: make build
        shell: bash

      - name: make test
        run: make test
        shell: bash

      - name: make lint
        run: make lint
        shell: bash

# Config for go-test-coverage, run by `make cover-check` after `make cover`.
#
# Only the overall figure gates: 80% total. File and package thresholds
# stay at 0 (report-only); add per-package overrides here if a package
# needs a different bar.
#
# The threshold is deliberately well below what the suite actually
# measures — 89.6% excluding the paths below, as of the R1 coverage work
# (see doc/implementation/00_gage-cli/plans/test-coverage/). It is a
# floor against a real regression, not a ratchet: setting it just under
# the current figure makes every ordinary change that touches a little
# untested error-handling turn CI red, which trains people to raise the
# number rather than to look at what slipped. Raise it when the *floor*
# should genuinely move, not to track the high-water mark.
profile: coverage.out

threshold:
  file: 0
  package: 0
  total: 80

# Neither of these ships in the gage binary, so neither counts toward
# coverage:
#
#   scripts/              standalone dev-only tools (e.g. resetlocalstate).
#   internal/gage/gittest  test scaffolding — the ephemeral bare-repo
#                          harness every sync test runs against. What is
#                          uncovered in it is its own t.Fatalf branches,
#                          which only fire when a fixture fails to build;
#                          "test the test helper's panic paths" is not a
#                          gap worth reporting as one.
exclude:
  paths:
    - ^scripts/
    - ^internal/gage/gittest/
